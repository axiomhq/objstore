name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # PR runs group by ref, so a newer push supersedes the older run; push
  # runs group by commit SHA, so every main commit keeps its own run.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go mod tidy
        run: go mod tidy -diff
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...
      - name: go test
        run: go test -race -count=1 ./...
      # vet type-checks the tests too, which go build skips.
      - name: cross-compile windows
        run: GOOS=windows go vet ./...
      - name: cross-compile darwin
        run: GOOS=darwin go vet ./...
      # fs has flock on illumos but not on solaris or aix (a stub there).
      - name: cross-compile illumos, solaris, aix
        run: |
          GOOS=illumos go vet ./...
          GOOS=solaris go vet ./...
          GOOS=aix GOARCH=ppc64 go vet ./...

  s3:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # MinIO no longer publishes public images or binaries; Bitnami's
      # frozen legacy image still serves the same server. A step rather
      # than a services: container so readiness can be polled from the host.
      - name: start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            bitnamilegacy/minio:2025.7.23-debian-12-r5
          for i in $(seq 60); do
            curl -fsS http://localhost:9000/minio/health/live && exit 0
            sleep 1
          done
          docker logs minio
          exit 1
      # MinIO creates the object on a PutIfMatch of a missing key, where
      # AWS S3 and R2 answer 404; the conformance suite isolates that check
      # in its ETagCASMissing subtest.
      - name: go test (MinIO)
        env:
          OBJSTORE_TEST_S3: http://localhost:9000
        run: go test -race -count=1 -skip '/ETagCASMissing' ./...

  macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: go test (darwin)
        run: go test -race -count=1 ./...
